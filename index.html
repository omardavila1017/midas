<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" href="/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/logos/senda-corporativo.svg" as="image" type="image/svg+xml" fetchpriority="high" />
    <link rel="icon" type="image/svg+xml" href="/logos/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logos/favicon-32.png" />
    <link rel="apple-touch-icon" href="/logos/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Midas centraliza la proyección financiera, cobranza, pagos, bancos y nómina de Senda en un tablero operativo." />
    <title>Midas</title>
    <style>
      html {
        background: #f8fafc;
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #f8fafc;
        color: #111827;
        font-family: Roboto, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
      }
    </style>
    <script>
      // Aplica el tema antes del primer paint para evitar FOUC.
      // Lee localStorage; si no hay preferencia, respeta prefers-color-scheme.
      (function () {
        try {
          var stored = localStorage.getItem('midas.theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) { /* noop */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
